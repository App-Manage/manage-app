name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cek struktur proyek
        run: |
          echo "Isi root repository:"
          ls -la
          if [ ! -f settings.gradle ]; then
            echo "::error title=Proyek Android tidak ditemukan::settings.gradle tidak ada di root repository. Isi root sekarang: $(ls | tr '\n' ' '). Upload ulang ISI proyek Android (bukan foldernya) ke root repository."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Tampilkan penyebab error
        if: failure()
        run: |
          if [ -f build.log ]; then
            MSG=$(grep -E -m1 -A12 'What went wrong|error:' build.log | tr '\n' ' ' | cut -c1-900)
            [ -z "$MSG" ] && MSG=$(tail -15 build.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Penyebab build gagal::$MSG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OfficeApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
